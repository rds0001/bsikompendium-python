[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsikompendium"
version = "0.2.0"
description = "Offline checks supporting BSI IT-Grundschutz assessments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "RiskDataScience GmbH"}, {name = "Dr. Dimitrios Geromichalos", email = "riskdatascience@web.de"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bsikompendium = ["resources/*.json", "resources/*.gz", "py.typed"]
